import java.security.MessageDigest
import java.util.zip.ZipFile
plugins { id 'java'; id 'maven-publish' }
version = '1.0.0'
group = 'uk.ashpoint'
base { archivesName = 'ashpoint-chat' }
// Minecraft 26.3 is distributed with readable names. No remapping step is needed.
// Pin the exact byte inputs, never resolve a drifting snapshot toolchain.
def inputsDir = layout.buildDirectory.dir('game-inputs')
def cpDir = layout.buildDirectory.dir('game-classpath')
tasks.register('prepareGameClasspath') {
 outputs.dir(cpDir)
 doLast {
  def downloads = [
   ['server.jar','https://piston-data.mojang.com/v1/objects/33680f5f2ac32864d6d7cf5e56a705fdb3e05f4c/server.jar','d052f14d7a173734fba553711e5b570162e2f2a313267ee31a21b975a679be64'],
   ['mixin.jar','https://maven.fabricmc.net/net/fabricmc/sponge-mixin/0.17.4+mixin.0.8.7/sponge-mixin-0.17.4+mixin.0.8.7.jar','1f0ae44db7295f8626f33b1dc0ad7f043d8954a8d6847247875fcc5dfcecc934'],
   ['carpet.jar','https://cdn.modrinth.com/data/TQTTVgYE/versions/yt9oDFOj/fabric-carpet-26.3%2Bv260915.jar','7c40b93e807ed914064176898037117097446c6cc76e6a80a856c8bf7f7659f9'],
   ['luckperms-api.jar','https://repo1.maven.org/maven2/net/luckperms/api/5.5/api-5.5.jar','cd910f936adc4dee7705fb51cc29401fde4f29aba6ee73a6475a3a0515f6294f'],
   ['loader.jar','https://maven.fabricmc.net/net/fabricmc/fabric-loader/0.19.5/fabric-loader-0.19.5.jar','93044e4dd46de5d8136701292f05e868da096d2c9fddb4793e4fdbcc63efc695'],
   ['fabric-api.jar','https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/0.161.0+26.3/fabric-api-0.161.0+26.3.jar','86f16178a3cecc887a85a4cfe9a79d92fa7341d8f39b5951a4d6ad800ab657a6']
  ]
  def cache=inputsDir.get().asFile;cache.mkdirs();def classpath=cpDir.get().asFile;classpath.mkdirs()
  downloads.each { row ->
   def f=new File(cache,row[0])
   for(int attempt=0;attempt<3;attempt++) {
    if(f.exists() && MessageDigest.getInstance('SHA-256').digest(f.bytes).encodeHex().toString().equals(row[2])) break
    if(f.exists() && !f.delete()) throw new GradleException('Cannot replace invalid dependency: '+row[0])
    def temp=new File(cache,row[0]+'.download')
    def connection=new URI(row[1]).toURL().openConnection();connection.connectTimeout=30000;connection.readTimeout=120000
    try { connection.inputStream.withCloseable { input -> java.nio.file.Files.copy(input,temp.toPath(),java.nio.file.StandardCopyOption.REPLACE_EXISTING) } }
    catch(Exception e) {temp.delete();if(attempt==2)throw e;continue}
    def hash=MessageDigest.getInstance('SHA-256').digest(temp.bytes).encodeHex().toString()
    if(!hash.equals(row[2])) {temp.delete();if(attempt==2)throw new GradleException('Checksum mismatch: '+row[0]);continue}
    java.nio.file.Files.move(temp.toPath(),f.toPath(),java.nio.file.StandardCopyOption.REPLACE_EXISTING)
   }
   if(!f.exists() || !MessageDigest.getInstance('SHA-256').digest(f.bytes).encodeHex().toString().equals(row[2])) throw new GradleException('Dependency not verified: '+row[0])
   logger.lifecycle('Verified '+row[0]+' ('+f.length()+' bytes)')
  }
  ['loader.jar','mixin.jar','carpet.jar','luckperms-api.jar'].each {name -> copy {from new File(cache,name);into classpath}}
  ['server.jar','fabric-api.jar'].each { bundle ->
   new ZipFile(new File(cache,bundle)).withCloseable { z -> z.entries().each { entry ->
    if(!entry.directory&&entry.name.endsWith('.jar')) { def name=entry.name.replace('/','_');z.getInputStream(entry).withCloseable { input -> def bytes=input.readAllBytes();if(bytes.length!=entry.size)throw new GradleException('Truncated archive entry: '+entry.name);def target=new File(classpath,name);java.nio.file.Files.write(target.toPath(),bytes);new ZipFile(target).close() } }
   } }
  }
 }
}
dependencies {  compileOnly fileTree(cpDir) { include '*.jar' }; testImplementation fileTree(cpDir) { include '*.jar' } }
java { toolchain.languageVersion = JavaLanguageVersion.of(25); withSourcesJar() }
tasks.withType(JavaCompile).configureEach { dependsOn 'prepareGameClasspath'; options.release = 25 }
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand version: project.version } }
jar { preserveFileTimestamps = false; reproducibleFileOrder = true; from('LICENSE') }
tasks.register('runtimeTestJar', Jar) {
 dependsOn testClasses
 archiveBaseName = 'ashpoint-chat-test-harness'
 from sourceSets.test.output
}

// Tests run inside a loaded dedicated server; the standalone JUnit discovery task is inapplicable.
test { enabled = false }

processTestResources { inputs.property 'testEntry', providers.gradleProperty('testEntry').getOrElse('RuntimeTests'); filesMatching('fabric.mod.json') { expand testEntry: providers.gradleProperty('testEntry').getOrElse('RuntimeTests') } }

